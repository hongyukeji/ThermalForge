name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test Debug
        run: bash Scripts/test.sh

      - name: Test Release
        run: bash Scripts/test.sh -c release

      - name: Check localization packaging
        run: bash Scripts/check-localization-package.sh
