name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test Debug
        run: bash Scripts/test.sh
      - name: Test Release
        run: bash Scripts/test.sh -c release
      - name: Build distribution
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash Scripts/package-release.sh
      - name: Check packaged resources
        run: bash Scripts/check-localization-package.sh .build/release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        # Publish only after the downloaded artifact has passed local acceptance.
        run: gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag --draft --title "MacFanPro $RELEASE_TAG" --notes-file CHANGELOG.md
